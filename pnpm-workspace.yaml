# pnpm 12 does not warn about skipped build scripts - it aborts the install with
# ERR_PNPM_IGNORED_BUILDS. The `pnpm` field in package.json is ignored in this
# version, and the key is called `allowBuilds` and is a MAP (not the
# `onlyBuiltDependencies` list that most older guides suggest).
allowBuilds:
  esbuild: true

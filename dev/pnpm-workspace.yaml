# Approvals for build scripts run at install time.
#
# Two pnpm 12 pitfalls, both hit on 07.09.2026:
#  1. A blocked build script ABORTS the install (ERR_PNPM_IGNORED_BUILDS), it
#     is not a warning. Exit code 1, nothing installed.
#  2. The "pnpm" field in package.json is NOT read (pnpm says so in the
#     warning), and the key is called `allowBuilds` and is a MAP - not
#     `onlyBuiltDependencies` with a list, like in earlier versions. Writing
#     it with the wrong key name goes through without a word of complaint and
#     does not work.
#
# This file was generated by `pnpm approve-builds esbuild`, and that is a more
# reliable path than writing it from memory. esbuild fetches a platform binary
# in postinstall and does not work without this.
#
# Do not list packages that are not in the tree: `approve-builds` then aborts
# with ERR_PNPM_APPROVE_BUILDS_UNKNOWN_PACKAGES and does nothing.
allowBuilds:
  esbuild: true
# pnpm 12 does not read the "pnpm" field from package.json and says so plainly
# in the warning. Configuration for build script approvals goes here instead.
#
# Why an explicit list rather than turning the check off entirely: esbuild
# fetches a platform binary in postinstall and does not work without this. The
# rest of the packages have no reason to run anything at install time.
#
# NOTE: do not list packages that are not in the tree here - `pnpm
# approve-builds` then aborts with the full ERR_PNPM_APPROVE_BUILDS_UNKNOWN_PACKAGES error.
